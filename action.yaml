name: Build and push x86-64 and arm-64 container images

inputs:
  architecture:
    default: all
    description: |
      Architecture name to build for: "all", "arm-64" or "x86-64".
  push-by-digest:
    description: |
      Push the image of a single architecture untagged and only output its
      digest. Tags, the description and the cleanup of old images are left to
      the "merge" action which combines the digests of all architectures.
    default: false
  build-args:
    description: List of build-time variables.
  build-target:
    description: Sets the target stage to build.
  dockerfile-path:
    description: Sets the path to dockerfile to use for building the image.
    default: Dockerfile

  cache-key:
    description: |
      An explicit key for restoring and saving the cache. Refer creating a
      cache key.
    default: buildx-layer
  cache-restore-keys:
    description: |
      An ordered list of prefix-matched keys to use for restoring stale cache
      if no cache hit occurred for key.
    default: buildx-layer
  delete-old-images:
    description: Delete old images.
    default: true
  use-cache:
    description: Use cache when building the image.
    default: true

  name:
    description: Image name to build.
    required: true
  description:
    description: Image description to annotate with.
  tags:
    description: Image tags to use for registering.
  labels:
    description: Image labels to annotate registered image with.

  registry:
    description: Registry to use for image upload.
    required: true
  username:
    description: Login to use for authenticating against registry.
    required: true
  ownername:
    description: |
      Repository owner name. If not set use provided user names instead.
  password:
    description: Password to log into registry.
    required: true

  alternate-registry:
    description: Alternate registry to use for image upload.
  alternate-username:
    description: |
      Login to use for authenticating against alternate registry. If not set
      use main username.
  alternate-ownername:
    description: |
      Repository owner name. If not set use provided user names instead.
  alternate-password:
    description: |
      Password to log into alternate registry. If not set use main password.

outputs:
  digest:
    description: Digest of the pushed image.
    value: ${{ steps.build.outputs.digest }}

runs:
  using: composite

  steps:
    - if: contains(inputs.push-by-digest, 'true') && inputs.architecture == 'all'
      name: Check that a single architecture is pushed by digest.
      shell: bash
      run: |
        echo '::error::"push-by-digest" needs "architecture" set to "arm-64" or "x86-64".'
        exit 1

    - uses: actions/checkout@v7

    - name: Determine image registry urls.
      id: registry
      shell: bash
      run: |
        echo "url=${{ inputs.registry }}/${{ inputs.ownername || inputs.username }}/${{ inputs.name }}" >> $GITHUB_OUTPUT
        if [[ "${{ inputs.alternate-registry }}" != '' ]]; then
          echo "alternate_url=${{ format('{0}/{1}/{2}', inputs.alternate-registry, inputs.alternate-ownername || inputs.alternate-username || inputs.ownername || inputs.username, inputs.name) }}" >> $GITHUB_OUTPUT
        fi

    - if: |
        inputs.architecture == 'all' ||
        inputs.architecture == 'arm-64' &&
        (runner.arch == 'X86' || runner.arch == 'X64') ||
        inputs.architecture == 'x86-64' && runner.arch == 'ARM64'
      name: Set up QEMU for emulating arm architecture on x86 or vice versa.
      uses: docker/setup-qemu-action@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log into the Container registry
      uses: docker/login-action@v4
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}

    - if: inputs.alternate-registry
      name: Log into the alternate Container registry
      uses: docker/login-action@v4
      with:
        registry: ${{ inputs.alternate-registry }}
        username: ${{ inputs.alternate-username || inputs.username }}
        password: ${{ inputs.alternate-password || inputs.password }}

    - name: Extract metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: |
          ${{ steps.registry.outputs.url }}
          ${{ steps.registry.outputs.alternate_url }}
        # NOTE: If not set branch name will be used.
        tags: latest

    # NOTE: Prefix cache keys with the architecture, so that builds of
    # different architectures do not restore the layers of each other.
    - if: contains(inputs.use-cache, 'true')
      name: Determine cache keys of the architecture.
      id: cache_keys
      shell: bash
      env:
        ARCHITECTURE: ${{ inputs.architecture }}
        KEY: ${{ inputs.cache-key }}
        RESTORE_KEYS: ${{ inputs.cache-restore-keys }}
      run: |
        echo "key=${ARCHITECTURE}-${KEY}" >> "$GITHUB_OUTPUT"
        {
          echo 'restore_keys<<EOM'
          while read -r key; do
            if [[ "$key" != '' ]]; then
              echo "${ARCHITECTURE}-${key}"
            fi
          done <<< "$RESTORE_KEYS"
          echo EOM
        } >> "$GITHUB_OUTPUT"

    - if: contains(inputs.use-cache, 'true')
      name: Prepare container cache layers
      uses: actions/cache@v5
      with:
        path: /tmp/buildx-layer-cache
        key: ${{ steps.cache_keys.outputs.key }}
        restore-keys: ${{ steps.cache_keys.outputs.restore_keys }}

    # NOTE: An image pushed by digest is only named by its repositories.
    - name: Set resolved tag by given branch name.
      id: derive_tags
      shell: bash
      env:
        ALTERNATE_URL: ${{ steps.registry.outputs.alternate_url }}
        PUSH_BY_DIGEST: ${{ contains(inputs.push-by-digest, 'true') }}
        TAGS: ${{ inputs.tags }}
        URL: ${{ steps.registry.outputs.url }}
      run: |
        {
          echo 'names<<EOM'
          if [[ "$PUSH_BY_DIGEST" == true ]]; then
            echo "$URL"
            if [[ "$ALTERNATE_URL" != '' ]]; then
              echo "$ALTERNATE_URL"
            fi
          else
            while read -r name; do
              echo "${URL}:${name}"
              if [[ "$ALTERNATE_URL" != '' ]]; then
                echo "${ALTERNATE_URL}:${name}"
              fi
            done < <(bash "${{ github.action_path }}/derive-tags.sh")
          fi
          echo EOM
        } >> "$GITHUB_OUTPUT"

    - name: Build for ${{ inputs.architecture }} architecture and push image
      id: build
      uses: docker/build-push-action@v7
      with:
        build-args: ${{ inputs.build-args }}
        file: ${{ inputs.dockerfile-path }}
        target: ${{ inputs.build-target }}
        context: .

        cache-from: |
          ${{
            contains(inputs.use-cache, 'true') &&
            'type=local,src=/tmp/buildx-layer-cache' ||
            ''
          }}
        cache-to: |
          ${{
            contains(inputs.use-cache, 'true') &&
            'type=local,dest=/tmp/buildx-layer-cache-new' ||
            ''
          }}
        no-cache: ${{ !contains(inputs.use-cache, 'true') }}

        # NOTE: Build for arm and x86 architecture with 64 bit.
        platforms: |
          ${{
            inputs.architecture == 'all' &&
            'linux/amd64,linux/arm64' ||
            inputs.architecture == 'arm-64' &&
            'linux/arm64' ||
            inputs.architecture == 'x86-64' &&
            'linux/amd64'
          }}

        tags: ${{ steps.derive_tags.outputs.names || steps.meta.outputs.tags }}
        labels: ${{ inputs.labels || steps.meta.outputs.labels }}
        # NOTE: Annotations are not parsed as comma separated values like
        # "outputs", so the description may contain commas. Images pushed by
        # digest get their description when merged.
        annotations: |
          ${{
            !contains(inputs.push-by-digest, 'true') &&
            (
              inputs.description || github.event.repository.description
            ) &&
            format(
              'index:org.opencontainers.image.description={0}',
              inputs.description || github.event.repository.description
            ) ||
            ''
          }}

        outputs: |
          ${{
            contains(inputs.push-by-digest, 'true') &&
            'type=image,push-by-digest=true,name-canonical=true,push=true' ||
            ''
          }}
        pull: true
        push: ${{ !contains(inputs.push-by-digest, 'true') }}

    # This ugly bit is necessary if you don't want your cache to grow forever
    # until it hits GitHub's limit of 5GB.
    # Temp fix
    # https://github.com/docker/build-push-action/issues/252
    # https://github.com/moby/buildkit/issues/1896
    - if: contains(inputs.use-cache, 'true')
      name: Move cache
      shell: bash
      run: |
        rm -rf /tmp/buildx-layer-cache
        mv /tmp/buildx-layer-cache-new /tmp/buildx-layer-cache

    # NOTE: GitHub lists the platform images of a multi-architecture image
    # as untagged versions, so deleting untagged package versions directly
    # makes older tags unpullable. This action only deletes untagged images
    # as a whole. Images pushed by digest are untagged until they are merged,
    # so they are cleaned up by the "merge" action.
    - if: |
        contains(inputs.delete-old-images, 'true') &&
        !contains(inputs.push-by-digest, 'true') &&
        inputs.registry == 'ghcr.io'
      name: Delete deprecated images.
      uses: dataaxiom/ghcr-cleanup-action@v1
      with:
        owner: ${{ inputs.ownername || inputs.username }}
        package: ${{ inputs.name }}
        keep-n-untagged: 50
